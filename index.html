<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gold Savings Manager</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#b8862b">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{--bg:#fdf6e7;--cd:#f6e7c6;--ac:#b8862b;--dk:#4a3416;--md:#8a6a33;--in:#fffaf0;--bt:#e2bd6b;--bd:#d9bd82;--ln:#ead6a6}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--dk);font:13px system-ui,sans-serif}
#app{height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:auto}
.hd{text-align:center;padding:6px 0 5px;background:var(--cd);border-bottom:2px solid var(--ac)}
.lg{width:38px;height:38px;border-radius:50%;margin:0 auto 3px;overflow:hidden;background:#fff;border:2px solid var(--ac);display:flex;align-items:center;justify-content:center;color:var(--ac)}
.lg img{width:100%;height:100%;object-fit:cover}
h1{font:700 16px Georgia,serif}
h2{font:700 14.5px Georgia,serif;margin:2px 0 6px;text-align:center}h3{font:700 13.5px Georgia,serif;margin-bottom:6px;text-align:center}
main{flex:1;min-height:0;overflow:auto;padding:8px 12px;display:flex;flex-direction:column}
.sc{flex:1;min-height:60px;overflow:auto;margin-top:4px}
.m,small{color:var(--md);font-size:11.5px;line-height:1.45}
label{display:block;margin:7px 0 3px;font-size:11.5px;color:var(--md)}
input,select,textarea{width:100%;padding:8px 10px;border-radius:9px;border:1px solid var(--bd);background:var(--in);color:var(--dk);font-size:13px}
.b{display:block;width:100%;margin-top:9px;padding:10px;border:0;border-radius:11px;background:var(--bt);color:var(--dk);font-weight:700;font-size:13px;text-align:center;text-decoration:none;flex:none}
.b.o{background:none;border:1px solid var(--ac)}
.s{padding:6px 10px;border:0;border-radius:9px;background:var(--ac);color:#fff;font-weight:600;font-size:11.5px;flex:none}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--ln)}
.r.l{justify-content:flex-start;align-items:flex-start;font-size:12.5px}.r.c{font-size:11px;padding:5px 0}
.am{min-width:74px;white-space:nowrap}
.hs{overflow-x:auto;white-space:nowrap;scrollbar-width:none;min-width:0}.hs::-webkit-scrollbar{display:none}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:start}.cl{display:flex;flex-direction:column;gap:8px;min-width:0}
.tl{background:var(--cd);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:4px;min-width:0}.tl .s{width:100%;margin-top:3px}
.s.o{background:none;border:1px solid var(--ac);color:var(--dk)}
.pa{border-bottom:1px solid var(--ln)}.pa .r{border:0;padding:12px 0}.pd{padding:0 0 10px;font-size:12px;color:var(--md);display:flex;flex-direction:column;gap:3px}
.tt>div{overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.ar{min-width:80px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ac{background:var(--cd);border-radius:12px;padding:6px 10px 10px;margin-bottom:8px}.ac .r{border:0}.ac .s{width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:left;background:var(--cd);border-radius:12px;padding:8px;margin-bottom:6px;font-size:11px;flex:none}.tt b{font-size:14px;display:block;text-align:center}.lr{display:flex;justify-content:space-between;gap:12px;padding:3px 0;font-size:12.5px}.tt .lr b{display:inline;font-size:12.5px;text-align:right}.gt{border-top:1px solid var(--bd);margin-top:4px;padding-top:6px;font-weight:700}.ver{text-align:center;font-size:10.5px;color:var(--md);padding:4px 0}.nv svg{display:block;margin:auto}.th{text-align:center;color:var(--md)}.hr2{position:relative;padding:0 62px}.hr2 .s{position:absolute;right:0;top:0}
.nv{display:flex;gap:10px;padding:7px 12px calc(7px + env(safe-area-inset-bottom));background:var(--cd);border-top:2px solid var(--ac)}
.nv button{flex:1;padding:9px;border:1px solid var(--ac);border-radius:11px;background:var(--in);color:var(--dk);font-weight:700;font-size:13px}
.bk{position:fixed;inset:0;background:rgba(74,52,22,.35)}
.sh{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:auto;background:var(--in);border-radius:18px 18px 0 0;border-top:3px solid var(--ac);padding:12px 12px calc(12px + env(safe-area-inset-bottom));max-height:92dvh;overflow:auto}
.hm{display:flex;flex-direction:column;justify-content:center;flex:1}.hm .b{padding:13px;font-size:15px}
</style></head><body><div id="app"></div>
<script>
const K='bj_savings_v2',$=i=>document.getElementById(i),z=n=>String(n).padStart(2,'0');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=n=>'₹'+Number(n||0).toLocaleString('en-IN');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())};
const fd=s=>s?s.split('-').reverse().join('-'):'';
const ph=s=>{const d=String(s||'').replace(/\D/g,'');return d.length>10?d.slice(-10):d};
let D;try{D=JSON.parse(localStorage.getItem(K))}catch(e){}
D=D||{c:[],a:[],p:[],n:1,g:1,s:1,set:{shop:'',addr:'',mob:'',theme:'gold',logo:'',gn:'Gold Savings Scheme',sn:'Small Savings Scheme',ten:12}};D.ct=D.ct||[];
const save=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){alert('Could not save on this phone. Export a backup now.')}};
let V={p:D.set.shop?'home':'setup'},H=[],S=null,Q='',F=today(),T=today(),AO=today(),FT='all',FS='all';
const go=(p,id,x)=>{H.push(V);V={p:p,id:id,x:x};S=null;render()};
const rep=(p,id,x)=>{V={p:p,id:id,x:x};S=null;render()};
const bk=()=>{V=H.pop()||{p:'home'};S=null;render()};
const hm=()=>{H=[];V={p:D.set.shop?'home':'setup'};S=null;render()};
const cust=id=>D.c.find(x=>x.id==id),acc=id=>D.a.find(x=>x.id==id);
const sname=a=>a.t=='g'?D.set.gn:D.set.sn,sn2=a=>a.t=='g'?'GSS':'SS';
const mig=()=>{D.a.forEach(a=>{if(a.t=='s'&&/^SS\d{1,3}$/.test(a.no))a.no='SS'+a.no.slice(2).padStart(4,'0')});if(D.set.addr==null)D.set.addr='No. 12, Venkatraman Salai, Choolaipaalam, M.G.R Nagar, Chennai 600 078';if(D.set.mob==null)D.set.mob='9840042311'};mig();
const sgn=p=>p.k=='out'?-p.m:p.m;
const sum=(id,k)=>D.p.filter(x=>x.a==id&&x.k==k).reduce((s,p)=>s+p.m,0);
const bl=(id,d)=>D.p.filter(p=>p.a==id&&(!d||p.d<=d)).reduce((s,p)=>s+sgn(p),0);
const ap=id=>D.p.filter(x=>x.a==id).sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:b.id-a.id);
const inC=c=>c.vc||D.ct.some(x=>x.phone==c.phone);
const pickOK=()=>!!(window.isSecureContext&&navigator.contacts&&navigator.contacts.select);
const opt=(v,A)=>A.map(x=>'<option value="'+x[0]+'"'+(x[0]==v?' selected':'')+'>'+x[1]+'</option>').join('');
function smsLink(a,t){return'sms:'+cust(a.c).phone+'?body='+encodeURIComponent(t)}
function head(){const s=D.set;return'<div class=hd><div class=lg>'+(s.logo?'<img src="'+s.logo+'">':'✦')+'</div><h1>'+esc(s.shop||'Gold Savings Manager')+'</h1></div>'}
async function saveFile(name,text,type){
 try{const dl=window.claude?await claude.use('downloads'):null;
  if(dl){await dl.save({filename:name,data:text});return true}}
 catch(e){if(e&&e.code=='declined')return false;if(e&&e.code=='rejected_extension'){alert('This file type cannot be saved from the online page. Use the downloaded app file instead.');return false}}
 const u=URL.createObjectURL((text instanceof Blob?text:new Blob([text],{type:type||'text/plain'}))),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();return true}

function vHome(){return'<div class=hm><button class=b onclick="go(\'srch\')">Customer</button><button class=b onclick="go(\'days\')">Day&#39;s Collection</button><button class=b onclick="go(\'accts\')">Accounts</button><button class=b onclick="go(\'sets\')">⚙ Settings</button></div><div class=ver>Gold Savings Manager · Version '+VER+'</div>'}
function vSetup(){return'<h2>Welcome</h2><p class=m style="text-align:center">Please fill in your shop details to start using the app.</p><label>Shop name</label><input id=u1><label>Shop address (for printouts)</label><input id=u2><label>Shop mobile</label><input id=u3 type=tel inputmode=numeric><button class=b onclick="saveSetup()">Save and continue</button>'}
function saveSetup(){const n=$('u1').value.trim();if(!n)return alert('Please enter the shop name');D.set.shop=n;D.set.addr=$('u2').value.trim();D.set.mob=ph($('u3').value);save();hm()}
function rsHtml(){const q=Q.trim().toLowerCase();if(!q)return'<p class=m>Type a name or mobile number to search.</p>';
 const L=srt(D.c.filter(c=>(c.name+' '+c.phone).toLowerCase().includes(q)),q,c=>c.name);
 let h=L.length?L.map(c=>'<div class=r><div><b>'+esc(c.name)+'</b><br><small>'+esc(c.phone||'No mobile')+'</small></div><button class=s onclick="go(\'cust\','+c.id+')">Show A/c</button></div>').join(''):'<p class=m>Customer not found.</p><button class=b onclick="go(\'newc\')">Add New</button>';
 const C=srt(D.ct.filter(x=>(x.name+' '+x.phone).toLowerCase().includes(q)&&!D.c.some(c=>c.phone==x.phone)),q,x=>x.name).slice(0,20);
 if(C.length)h+='<p class=m style="margin-top:8px">From contacts</p>'+C.map(x=>'<div class=r><div><b>'+esc(x.name)+'</b><br><small>'+x.phone+'</small></div><button class=s onclick="fromCt('+D.ct.indexOf(x)+')">Add</button></div>').join('');
 return h}
function vSrch(){return'<h2>Customer</h2><input id=q placeholder="Name or mobile number" value="'+esc(Q)+'" oninput="Q=this.value;$(\'rs\').innerHTML=rsHtml()"><div class=sc id=rs>'+rsHtml()+'</div><button class="b o" onclick="syncC()">Sync Contacts ('+D.ct.length+')</button>'+(D.ct.length?'':'<small style="display:block;text-align:center;margin-top:4px">On the phone: Contacts app → Settings → Export → save the .vcf file, then choose it here.</small>')+'<input type=file id=vf hidden accept=".vcf,text/vcard,text/x-vcard,text/plain" onchange="impVcf(event)">'}
async function syncC(){if(pickOK()){try{const r=await navigator.contacts.select(['name','tel'],{multiple:true}),have=new Set(D.ct.map(x=>x.phone));let k=0;
 r.forEach(x=>{const n=(x.name||[])[0],p=ph((x.tel||[])[0]);if(n&&p.length>=10&&!have.has(p)){have.add(p);D.ct.push({name:n,phone:p});k++}});save();alert(k+' new contacts imported');render()}catch(e){}}else $('vf').click()}
function addFromCt(n,t){t=ph(t);if(!n&&!t)return;const c=t&&D.c.find(x=>x.phone==t);if(c)go('cust',c.id);else go('newc',0,{n:n||'',p:t})}
const fromCt=i=>addFromCt(D.ct[i].name,D.ct[i].phone);
async function pickC(){try{const r=await navigator.contacts.select(['name','tel'],{multiple:false});if(r&&r[0])addFromCt((r[0].name||[])[0]||'',(r[0].tel||[])[0]||'')}catch(e){}}
function cform(c){c=c||{};return'<label>Name</label><input id=cn value="'+esc(c.name)+'"><label>Mobile number (optional)</label><input id=cp type=tel inputmode=numeric value="'+esc(c.phone)+'"><label>Address</label><textarea id=ca rows=2>'+esc(c.addr)+'</textarea>'}
function readC(){const n=$('cn').value.trim(),raw=$('cp').value.trim(),p=ph(raw);
 if(!n){alert('Enter the customer name');return null}
 if(raw&&p.length<10){alert('Enter a valid 10-digit mobile number, or leave it empty');return null}
 return{name:n,phone:p,addr:$('ca').value.trim()}}
function vNewc(){const x=V.x,d=/^[\d\s+]+$/.test(Q.trim());return'<h2>Add New Customer</h2>'+cform(x?{name:x.n,phone:x.p}:(d?{phone:Q.trim()}:{name:Q.trim()}))+'<button class=b onclick="addC()">Save customer</button>'}
function addC(){const o=readC();if(!o)return;
 if(o.phone&&D.c.some(c=>c.phone==o.phone)&&!confirm('This mobile number already exists. Add anyway?'))return;
 if(V.x&&V.x.p&&o.phone==V.x.p)o.vc=1;o.id=D.n++;D.c.push(o);save();Q='';rep('cust',o.id)}
function vEditc(){return'<h2>Edit Customer</h2>'+cform(cust(V.id))+'<button class=b onclick="saveC()">Save changes</button>'}
function saveC(){const o=readC();if(!o)return;const c=cust(V.id);
 if(o.phone&&o.phone!=c.phone&&D.c.some(x=>x.id!=c.id&&x.phone==o.phone)&&!confirm('Another customer has this number. Save anyway?'))return;
 if(o.phone!=c.phone)c.vc=0;Object.assign(c,o);save();bk()}
async function vcf(id){const c=cust(id),t='BEGIN:VCARD\r\nVERSION:3.0\r\nFN:'+c.name+'\r\nN:;'+c.name+';;;\r\nTEL;TYPE=CELL:'+c.phone+'\r\nEND:VCARD\r\n';
 if(await saveFile((c.name.replace(/[^\w ]/g,'').trim()||'contact')+'.vcf',t,'text/vcard')){c.vc=1;save();render()}}
const tiles=A=>{const G=A.filter(a=>a.t=='g'),M=A.filter(a=>a.t=='s'),col=L=>'<div class=cl>'+L.map(card).join('')+'</div>';return'<div class=tg>'+(G.length?col(G)+col(M):col(M)+'<div></div>')+'</div>'};
function card(a){const g=a.t=='g',i=sum(a.id,'in'),o=sum(a.id,'out'),L=t=>'<div class=hs style="font-size:12.5px">'+t+'</div>';
 return'<div class=tl onclick="go(\'acc\','+a.id+')"><div class=hs><b>'+a.no+'</b> · '+sn2(a)+(a.st!='open'?' <em>('+a.st+')</em>':'')+'</div>'+(g?L('Amt Rd <b>'+inr(i)+'</b>'):L('A/c Bal <b>'+inr(i-o)+'</b>'))+(a.st=='open'?'<button class=s onclick="event.stopPropagation();pay('+a.id+')">Collect Payment</button>':'')+'</div>'}
function vCust(){const c=cust(V.id),A=D.a.filter(a=>a.c==c.id&&a.st=='open'),P=D.a.filter(a=>a.c==c.id&&a.st!='open');
 return'<div class=hr2><h2>'+esc(c.name)+'</h2><button class=s onclick="go(\'editc\','+c.id+')">Edit</button></div><p class="m hs">'+esc(c.phone||'No mobile number')+' · '+esc(c.addr||'No address')+'</p>'
 +(c.phone?(inC(c)?'<small>✓ Saved in contacts</small>':'<div><button class=s style="margin-top:6px" onclick="vcf('+c.id+')">Save to Contacts</button></div>'):'')
 +'<h3 style="margin-top:8px">Accounts</h3><div class=sc>'+(A.length?tiles(A):'<p class=m>No active account.</p>')+'</div>'+(P.length?'<button class="b o" onclick="go(\'past\','+c.id+')">Past Accounts ('+P.length+')</button>':'')+'<button class=b onclick="go(\'newa\','+c.id+')">Open Account</button>'}
function vPast(){const c=cust(V.id),P=D.a.filter(a=>a.c==c.id&&a.st!='open').sort((a,b)=>(b.cd||'')>(a.cd||'')?1:(b.cd||'')<(a.cd||'')?-1:b.id-a.id);
 return'<h2>Past Accounts · '+esc(c.name)+'</h2><div class=sc>'+(P.length?P.map(a=>{const o=V.x==a.id,L=t=>'<div class=hs>'+t+'</div>';
  return'<div class=pa><div class=r onclick="V.x='+(o?0:a.id)+';render()"><b>'+a.no+'</b><span>'+(a.cd?fd(a.cd):'—')+' &nbsp;'+(o?'▴':'▾')+'</span></div>'
  +(o?'<div class=pd>'+L(sn2(a)+' · '+(a.st=='closed'?'Closed':'Transferred'))+L('Reason: '+esc(a.cr||'—')+(a.to?' → '+esc(a.to):''))+L('Received '+inr(sum(a.id,'in'))+' · Paid '+inr(sum(a.id,'out')))+L('Balance <b>'+inr(bl(a.id))+'</b>')+'<button class="s o" style="width:auto;align-self:flex-start;margin-top:4px" onclick="go(\'acc\','+a.id+')">View transactions</button></div>':'')+'</div>'}).join(''):'<p class=m>No past accounts.</p>')+'</div>'}
function vNewa(){
 if(!V.x)return'<h2>Open Account</h2><p class=m>Choose a scheme</p><button class=b onclick="V.x=\'g\';render()">'+esc(D.set.gn)+'<br><small>Fixed amount · '+D.set.ten+' months</small></button><button class=b onclick="V.x=\'s\';render()">'+esc(D.set.sn)+'<br><small>Receipt &amp; payment · no fixed amount</small></button>';
 const g=V.x=='g';return'<h2>'+esc(g?D.set.gn:D.set.sn)+'</h2>'+(g?'<label>Fixed monthly amount (₹)</label><input id=am type=number inputmode=numeric>':'')+'<label>Start date</label><input id=as type=date value="'+today()+'"><button class=b onclick="addA()">Open Account</button>'}
function addA(){const g=V.x=='g',m=g?+$('am').value:0;
 if(!$('as').value||(g&&!(m>0)))return alert('Enter '+(g?'the monthly amount and ':'')+'the start date');
 const no=g?'GS'+String(D.g++).padStart(4,'0'):'SS'+String(D.s++).padStart(4,'0');
 D.a.push({id:D.n++,no:no,t:V.x,c:V.id,s:$('as').value,m:m,st:'open'});save();rep('cust',V.id)}
function vAcc(){const a=acc(V.id),c=cust(a.c),g=a.t=='g',L=ap(a.id),i=sum(a.id,'in'),o=sum(a.id,'out');
 return'<div class=hr2><h2>'+a.no+' · '+sn2(a)+'</h2><button class=s onclick="prt('+a.id+')">Print PDF</button></div><p class="m hs">'+esc(c.name)+' · '+esc(c.phone||'No mobile')+'<br>'+(g?'₹'+a.m+'/month · '+D.p.filter(x=>x.a==a.id&&x.k=='in').length+'/'+D.set.ten+' paid · ':'')+'Received '+inr(i)+(g?'':' · Paid '+inr(o)+' · Bal '+inr(i-o))
 +(a.st!='open'?'<br><b>'+a.st.toUpperCase()+' on '+fd(a.cd)+'</b> · '+esc(a.cr)+(a.to?' → '+esc(a.to):''):'')+'</p><h3 style="margin-top:8px">History</h3><div class=sc>'
 +(L.length?L.map(p=>'<div class="r l c"><b class=am>'+(p.k=='out'?'−':'+')+inr(p.m)+'</b><div>'+fd(p.d)+' · '+p.md+(p.n?' · '+esc(p.n):'')+'</div></div>').join(''):'<p class=m>No payments yet.</p>')+'</div>'
 +(a.st=='open'?'<button class=b onclick="pay('+a.id+')">Collect Payment</button><div class=two>'+(g?'':'<button class="b o" onclick="tr('+a.id+')">Transfer Account</button>')+'<button class="b o" style="'+(g?'grid-column:1/3':'')+'" onclick="cl('+a.id+')">Close Account</button></div>':'')}
function vAccts(){const L=D.a.filter(a=>(FT=='all'||a.t==FT)&&(FS=='all'||(FS=='act')==(a.st=='open')));
 const P=D.p.filter(p=>p.d<=AO),by=t=>{const ids=new Set(D.a.filter(a=>a.t==t).map(a=>a.id));return P.filter(p=>ids.has(p.a)).reduce((s,p)=>s+sgn(p),0)},g=by('g'),sm=by('s'),ft=L.reduce((s,a)=>s+bl(a.id,AO),0);
 return'<div class=r style="border:0;padding:0 0 6px"><h2 style="margin:0;text-align:left">Accounts</h2><label style="margin:0;display:flex;align-items:center;gap:6px;white-space:nowrap">As on <input type=date value="'+AO+'" onchange="AO=this.value||today();render()" style="width:auto;padding:5px;font-size:13px"></label></div>'
 +'<div class=tt style="display:block"><div class=lr><span>'+esc(D.set.gn)+'</span><b>'+inr(g)+'</b></div><div class=lr><span>'+esc(D.set.sn)+'</span><b>'+inr(sm)+'</b></div><div class="lr gt"><span>Grand Total</span><b>'+inr(g+sm)+'</b></div></div>'
 +'<div class=two><select onchange="FT=this.value;render()">'+opt(FT,[['all','All types'],['g','Gold'],['s','Small']])+'</select><select onchange="FS=this.value;render()">'+opt(FS,[['all','Active &amp; closed'],['act','Active'],['cls','Closed']])+'</select></div>'
 +'<div class=r style="border:0;padding:6px 0 0"><small>'+L.length+' account(s) · balance '+inr(ft)+'</small><button class=s onclick="ex(\'accts\')">Export</button></div><div class=sc>'
 +(L.map(a=>{const c=cust(a.c);return'<div class="r c" onclick="go(\'acc\','+a.id+')"><div style="flex:1;min-width:0"><div class=hs><b>'+a.no+'</b> · '+esc(c.name)+' · '+esc(c.phone||'No mobile')+'</div><div class=hs>'+sn2(a)+' · '+(a.st=='open'?'Active':a.st=='closed'?'Closed':'Transferred')+(a.t=='g'?' · ₹'+a.m+'/mo':'')+'</div><div class=hs style="display:flex;justify-content:space-between;gap:14px"><span>Received '+inr(sum(a.id,'in'))+'</span><span>Balance '+inr(bl(a.id,AO))+'</span></div></div><span>›</span></div>'}).join('')||'<p class=m>No accounts.</p>')+'</div>'}
